<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liederanzeige</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #voices {
            display: flex;
            width: 100%;
        }
        .voice {
            flex: 1;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #000;
            font-weight: bold;
        }
        #text {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1rem;
            font-size: clamp(20px, 8vw, 30px);
        }
    </style>
</head>
<body>
    <div id="voices">
        <div id="tenor" class="voice" style="background: {% if entry and entry.tenor %}green{% else %}#000{% endif %}; color: {% if entry and entry.tenor %}#000{% else %}#000{% endif %};">T</div>
        <div id="sopran" class="voice" style="background: {% if entry and entry.sopran %}red{% else %}#000{% endif %}; color: {% if entry and entry.sopran %}#000{% else %}#000{% endif %};">S</div>
        <div id="alt" class="voice" style="background: {% if entry and entry.alt %}yellow{% else %}#000{% endif %}; color: {% if entry and entry.alt %}#000{% else %}#000{% endif %};">A</div>
        <div id="bass" class="voice" style="background: {% if entry and entry.bass %}blue{% else %}#000{% endif %}; color: {% if entry and entry.bass %}#000{% else %}#000{% endif %};">B</div>
    </div>
    <div id="text">{% if entry and entry.text %}{{ entry.text }}{% else %}{{ now|time:"H:i" }}{% endif %}</div>
    <script>
        if (!"{{ entry.text|default:'' }}") {
            const textDiv = document.getElementById('text');
            function updateTime() {
                const now = new Date();
                textDiv.textContent = now.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
            }
            setInterval(updateTime, 60000);
        }
    </script>
</body>
</html>
