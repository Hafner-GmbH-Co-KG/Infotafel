<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liedeingabe</title>
    <style>
        body {
            margin: 0;
            background: #f0f0f0;
            color: #000;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 1rem;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 500px;
        }
        textarea {
            width: 100%;
            height: 200px;
            font-size: 1rem;
            padding: 0.5rem;
        }
        .voices {
            display: flex;
            justify-content: space-between;
        }
        .voices label {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        input[type="number"], button {
            padding: 0.5rem;
            font-size: 1.2rem;
        }
        button {
            background: #ccc;
            border: none;
            cursor: pointer;
        }
        #preview {
            margin-top: 1rem;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 200px;
        }
        #preview .voice {
            flex: 1;
            height: 40px;
            background: #000;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        #preview #p_voices { display: flex; width: 100%; }
        #preview #p_text {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: .5rem;
            font-size: clamp(16px, 6vw, 24px);
        }
    </style>
</head>
<body>
    <form id="eingabe" method="post">
        {% csrf_token %}
        <textarea id="text" name="text" placeholder="Liedtext">{{ text }}</textarea>
        <div class="voices">
            <label><input id="sopran" name="sopran" type="checkbox" {% if sopran %}checked{% endif %}> Sopran</label>
            <label><input id="alt" name="alt" type="checkbox" {% if alt %}checked{% endif %}> Alt</label>
            <label><input id="tenor" name="tenor" type="checkbox" {% if tenor %}checked{% endif %}> Tenor</label>
            <label><input id="bass" name="bass" type="checkbox" {% if bass %}checked{% endif %}> Bass</label>
        </div>
        <input id="dauer" name="dauer" type="number" placeholder="Anzeigedauer (Sekunden)" min="1" value="{{ dauer }}">
        <button type="submit">Senden</button>
        <p id="status">{{ status }}</p>
    </form>

    <h2>Historie</h2>
    <ul>
        {% for e in history %}
        <li>{{ e.created|date:"d.m.Y H:i" }}: {{ e.text|default:"(leer)" }}</li>
        {% empty %}
        <li>Keine Einträge</li>
        {% endfor %}
    </ul>

    <div id="preview">
        <div id="p_voices">
            <div id="p_tenor" class="voice">T</div>
            <div id="p_sopran" class="voice">S</div>
            <div id="p_alt" class="voice">A</div>
            <div id="p_bass" class="voice">B</div>
        </div>
        <div id="p_text"></div>
    </div>

    <script>
        const pvColors = { sopran: 'red', alt: 'yellow', tenor: 'green', bass: 'blue' };
        const pvElems = {
            sopran: document.getElementById('p_sopran'),
            alt: document.getElementById('p_alt'),
            tenor: document.getElementById('p_tenor'),
            bass: document.getElementById('p_bass')
        };
        const pvText = document.getElementById('p_text');

        function updatePreview() {
            const textVal = document.getElementById('text').value.trim();
            ['sopran', 'alt', 'tenor', 'bass'].forEach(k => {
                const checked = document.getElementById(k).checked;
                pvElems[k].style.background = checked ? pvColors[k] : '#000';
                pvElems[k].style.color = checked ? '#000' : '#000';
            });
            pvText.textContent = textVal || new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
        }

        ['text','sopran','alt','tenor','bass','dauer'].forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('input', updatePreview);
            el.addEventListener('change', updatePreview);
        });
        updatePreview();
    </script>
</body>
</html>
